<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test 401 Event Sync</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .status {
      padding: 20px;
      margin: 20px 0;
      border-radius: 5px;
      background: #f0f0f0;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .success { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Test de synchronisation 401</h1>

  <div class="status">
    <h3>État actuel</h3>
    <p>Token dans localStorage: <span id="token-status">-</span></p>
    <p>Event 'auth:logout' reçu: <span id="event-status">Non</span></p>
  </div>

  <div>
    <h3>Actions de test</h3>
    <button onclick="setToken()">1. Définir un token</button>
    <button onclick="simulate401()">2. Simuler un 401</button>
    <button onclick="checkStatus()">3. Vérifier l'état</button>
    <button onclick="reset()">Réinitialiser</button>
  </div>

  <div class="status">
    <h3>Log</h3>
    <div id="log"></div>
  </div>

  <script>
    let eventReceived = false;

    // Écouter l'event auth:logout
    window.addEventListener('auth:logout', () => {
      eventReceived = true;
      log('✓ Event "auth:logout" reçu', 'success');
      updateStatus();
    });

    function setToken() {
      localStorage.setItem('token', 'test-token-123');
      log('Token défini dans localStorage', 'success');
      updateStatus();
    }

    function simulate401() {
      log('Simulation d\'une réponse 401...', 'info');

      // Simuler ce que fait api.js
      localStorage.removeItem('token');
      window.dispatchEvent(new Event('auth:logout'));

      log('✓ Token supprimé et event dispatché', 'success');
      updateStatus();
    }

    function checkStatus() {
      const hasToken = !!localStorage.getItem('token');
      const eventWasReceived = eventReceived;

      if (!hasToken && eventWasReceived) {
        log('✓ TEST RÉUSSI: Token supprimé ET event reçu', 'success');
      } else if (!hasToken && !eventWasReceived) {
        log('✗ Token supprimé mais event non reçu', 'error');
      } else if (hasToken && eventWasReceived) {
        log('✗ Event reçu mais token encore présent', 'error');
      } else {
        log('État initial - définir un token puis simuler un 401', 'info');
      }
    }

    function reset() {
      localStorage.removeItem('token');
      eventReceived = false;
      document.getElementById('log').innerHTML = '';
      log('Réinitialisé', 'info');
      updateStatus();
    }

    function updateStatus() {
      const token = localStorage.getItem('token');
      document.getElementById('token-status').textContent = token || '(vide)';
      document.getElementById('token-status').className = token ? 'success' : 'error';

      document.getElementById('event-status').textContent = eventReceived ? 'Oui' : 'Non';
      document.getElementById('event-status').className = eventReceived ? 'success' : 'error';
    }

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = type;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(entry);
    }

    // Initialisation
    updateStatus();
    log('Page de test chargée. Suivez les étapes numérotées.', 'info');
  </script>
</body>
</html>
