services:
  # Base de données PostgreSQL
  - type: pserv
    name: scenacte-db
    plan: free
    databaseName: scenacte
    databaseUser: scenacte
    ipAllowList: []

  # Backend API (Node.js/Express)
  - type: web
    name: scenacte-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: scenacte-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MAX_CONTENT_SIZE_MB
        value: 10
      - key: CLIENT_URL
        fromService:
          type: web
          name: scenacte-frontend
          property: host
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # Frontend (React/Vite)
  - type: web
    name: scenacte-frontend
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: npm run install:client && cd client && VITE_API_URL=$RENDER_EXTERNAL_URL npm run build
    staticPublishPath: ./client/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: scenacte-api
          envVarKey: RENDER_EXTERNAL_URL
