services:
  # Base de données PostgreSQL
  - type: pserv
    name: scenacte-db
    plan: free
    region: frankfurt

  # Backend API (Node.js/Express)
  - type: web
    name: scenacte-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run install:all && npm run build:client && cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: scenacte-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MAX_CONTENT_SIZE_MB
        value: 10
      - key: SERVE_FRONTEND
        value: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: scenacte-frontend
          envVarKey: RENDER_EXTERNAL_URL
      # Note: Les variables SMTP doivent être ajoutées manuellement après le déploiement
      # via l'interface Render : SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM

  # Frontend (React/Vite)
  # Note: Après le déploiement du backend, ajouter manuellement la variable
  # VITE_API_URL=https://[votre-backend-url]/api puis redéployer le frontend
  - type: web
    name: scenacte-frontend
    runtime: static
    plan: free
    buildCommand: npm run install:client && cd client && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
